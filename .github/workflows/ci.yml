name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung step used to run into GitHub's 6-hour default (smoke:server, June-August 2026).
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Installs exactly what package-lock.json lists. The lockfile carries every
      # platform's native packages (rollup, lightningcss, tailwind oxide), so it
      # must be regenerated with npm >= 11.6 when dependencies change -- see CONTRIBUTING.md.
      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run smoke:server

      - run: npm test
